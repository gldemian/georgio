name: Deploy to GitHub Pages

on:
  # Runs on pushes to the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'bodyby/package-lock.json'
      - name: Install dependencies
        run: |
          cd bodyby
          npm ci
      - name: Build
        run: |
          cd bodyby
          npm run build
      - name: Prepare Artifact
        run: |
          mkdir -p deploy_dist/bodyby
          # Move Vite build into the subdirectory
          cp -r bodyby/dist/* deploy_dist/bodyby/
          # Copy root assets (CNAME, robots.txt, pikachu index)
          cp index.html CNAME robots.txt deploy_dist/
          cp -r shared deploy_dist/shared/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy_dist'

  # Deploy job
  deploy:
    # Add a dependency on the build job
    needs: build
    runs-on: ubuntu-latest
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
